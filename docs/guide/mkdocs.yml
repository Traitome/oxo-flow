site_name: "oxo-flow"
site_url: https://traitome.github.io/oxo-flow/documentation/
site_description: "oxo-flow Documentation — Rust-native bioinformatics pipeline engine"
repo_url: https://github.com/Traitome/oxo-flow
repo_name: Traitome/oxo-flow
edit_uri: edit/main/docs/guide/src/

docs_dir: src
site_dir: site

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg

  font:
    text: Inter
    code: JetBrains Mono

  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

  features:
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
    - content.tooltips
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest

  icon:
    edit: material/pencil
    view: material/eye
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - abbr
  - def_list
  - footnotes
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ['../..']
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      toc_depth: 3
      permalink: "#"
  - tables

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Traitome/oxo-flow
      name: oxo-flow on GitHub

plugins:
  - search:
      lang: en

