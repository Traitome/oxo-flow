[package]
name = "oxo-flow-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core library for the oxo-flow bioinformatics pipeline engine"

[features]
# Cloud storage backends (opt-in)
s3-storage = ["aws-sdk-s3", "dep:aws-config"]
gcs-storage = ["dep:sha1"]
# NOTE: there are deliberately no other feature gates. The former
# `container`/`webhook`/`report`/`cluster` markers gated nothing (every
# dependency behind them is non-optional) and their cfg gates drifted
# out of sync, breaking `--no-default-features` builds (#982 P1-2) —
# the modules are now compiled unconditionally.

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
petgraph = { workspace = true }
glob = { workspace = true }
regex = { workspace = true }
tera = { workspace = true }
num_cpus = { workspace = true }
sha2 = { workspace = true }
sysinfo = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
hex = { workspace = true }
tempfile = { workspace = true }
csv = "1.4.0"
# FASTQ gzip decompression for `reads_count()` runtime `when` gates (#282)
flate2 = "1.0"
async-trait = { workspace = true }
# s3-storage: default-features = false minus `rustls` (#876) — the rustls
# feature is the sole activator of the legacy hyper-0.14 / rustls-0.21 /
# h2-0.3 chain; TLS stays via default-https-client (rustls 0.23 + aws-lc-rs).
aws-sdk-s3 = { version = "1", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"], optional = true }
aws-config = { version = "1", optional = true }
hmac = { workspace = true }
sha1 = { workspace = true, optional = true }
base64 = { workspace = true }
md-5 = { workspace = true }
# File locking (.oxo-flow/lock) is cross-platform; available_space (scheduler)
# is unix-only and stays inside cfg(unix) code.
fs2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
filetime = "0.2.29"
# Gallery-vs-schema drift gate (#973 F5): default features pull reqwest for
# remote $ref resolution, which this workspace never needs — the schema is
# self-contained.
jsonschema = { version = "0.60.2", default-features = false, features = ["resolve-file"] }

# Criterion benches are standalone binaries: `harness = false` stops libtest
# from wrapping them, so their `criterion_main!` actually runs. A bench file
# without an entry here is still auto-discovered, but compiles against the
# default libtest harness and reports "0 tests" — silently never measured.
[[bench]]
name = "wildcard_bench"
harness = false

[[bench]]
name = "dag_bench"
harness = false

[[bench]]
name = "dag_scale_bench"
harness = false

[[bench]]
name = "parsing_bench"
harness = false

[[bench]]
name = "scheduling_bench"
harness = false

[[bench]]
name = "api_response_bench"
harness = false

[[bench]]
name = "diagnostics_bench"
harness = false

[[bench]]
name = "wildcard_large_bench"
harness = false

