[package]
name = "oxo-flow-ai"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "AI provider abstraction, agent framework, and knowledge system for oxo-flow"

[features]
# Test-only: exposes the `scripted` stub provider constructors to integration
# tests of downstream crates (dev-dependencies). Production builds never
# enable it, so a real server cannot install a test stub (issue #1040 B3).
test-scripted = []

[dependencies]
futures = "0.3.32"
# Workspace
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
http = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

# Async trait support
async-trait = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["full", "macros"] }
tempfile = { workspace = true }
