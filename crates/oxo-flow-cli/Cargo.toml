[package]
name = "oxo-flow-cli"
version.workspace = true
include = ["src/**/*", "schema/**/*", "templates/**/*", "README.md", "LICENSE"]
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CLI for the oxo-flow bioinformatics pipeline engine"

[[bin]]
name = "oxo-flow"
path = "src/main.rs"

[features]
# Cloud storage backends (issue #78 P2 / #80): opt-in so the default build
# stays free of the aws-sdk dependency tree. Enabling registers the backend
# in the shared run/dry-run storage resolver (`run_preview::storage_resolver`).
s3-storage = ["oxo-flow-core/s3-storage"]
gcs-storage = ["oxo-flow-core/gcs-storage"]

[dependencies]
oxo-flow-core = { workspace = true }
oxo-flow-ai = { workspace = true }
oxo-flow-web = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
colored = { workspace = true }
chrono = { workspace = true }
indicatif = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
glob = { workspace = true }
filetime = "0.2.29"
oxo-license = "0.1.1"
sha2 = { workspace = true }
tar = "0.4"
zstd = { version = "0.13", default-features = false }
flate2 = "1.0"
walkdir = "2"
reqwest = { workspace = true }
tempfile = { workspace = true }
csv = "1.4.0"

[dev-dependencies]
oxo-flow-core = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
assert_cmd = "2.2.0"

# Desktop packaging (cargo-bundle): the single binary doubles as the
# desktop app — `oxo-flow serve --open` starts the web interface and opens
# the default browser. Bundles: .app/.dmg on macOS, .deb/.rpm/.AppImage on
# Linux (see Makefile `bundle-*` targets and docs/how-to/desktop-app.md).
[package.metadata.bundle]
name = "oxo-flow"
identifier = "org.oxoflow.oxoflow"
category = "DeveloperTool"
short_description = "Bioinformatics workflow engine with web interface"
# The SPA build output ships inside the bundle (Contents/Resources/static
# on macOS); the web server resolves it relative to the executable, so the
# desktop app works on machines without a source checkout.
# `crates/oxo-flow-cli/static/` is prepared by the Makefile bundle targets
# (copy of the SPA build output) — a ".." resource path would be mangled.
resources = ["static/"]
long_description = """
oxo-flow: Rust-native bioinformatics pipeline engine — DAG workflows,
graphical editor, AI-assisted pipeline generation, and cluster execution.
This desktop build starts the local web interface and opens it in your
browser (`oxo-flow serve --open`).
"""
