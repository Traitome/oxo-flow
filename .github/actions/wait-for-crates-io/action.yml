name: Wait for crates.io version
description: Poll crates.io until a published crate version becomes visible or the wait budget expires.

inputs:
  crate:
    description: Crate name to query.
    required: true
  version:
    description: Version that should become visible on crates.io.
    required: true
  timeout-seconds:
    description: Maximum total wait time.
    required: false
    default: "120"
  delay-seconds:
    description: Delay between polls.
    required: false
    default: "5"

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        CRATE='${{ inputs.crate }}'
        VERSION='${{ inputs.version }}'
        VERSION="${VERSION#v}"
        TIMEOUT_SECONDS='${{ inputs.timeout-seconds }}'
        DELAY_SECONDS='${{ inputs.delay-seconds }}'
        ATTEMPTS=$(( TIMEOUT_SECONDS / DELAY_SECONDS ))
        [ "${ATTEMPTS}" -gt 0 ] || ATTEMPTS=1

        for attempt in $(seq 1 "${ATTEMPTS}"); do
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://crates.io/api/v1/crates/${CRATE}/${VERSION}" \
            -H "User-Agent: oxo-flow-ci/1.0 (github.com/Traitome/oxo-flow)" \
            2>/dev/null || echo "000")
          if [ "${STATUS}" = "200" ]; then
            echo "${CRATE} ${VERSION} is visible on crates.io"
            exit 0
          fi
          if [ "${STATUS}" != "404" ] && [ "${STATUS}" != "000" ]; then
            echo "::warning::Unexpected crates.io status for ${CRATE} ${VERSION}: ${STATUS}"
          fi
          sleep "${DELAY_SECONDS}"
        done

        echo "::warning::Timed out waiting for ${CRATE} ${VERSION} to appear on crates.io; continuing"
