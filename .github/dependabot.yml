version: 2
updates:
  # Keep third-party actions pinned to current majors so Node-runtime
  # deprecations (node20 removal) surface as PRs instead of CI warnings.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
  # Cargo workspace + frontend npm deps: security bumps land as PRs
  # instead of manual commits (cf. the rustls RUSTSEC-2026-0285 bump).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
