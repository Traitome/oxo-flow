version: 2
updates:
  # Keep third-party actions pinned to current majors so Node-runtime
  # deprecations (node20 removal) surface as PRs instead of CI warnings.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"
  # Cargo workspace + frontend npm deps: security bumps land as PRs
  # instead of manual commits (cf. the rustls RUSTSEC-2026-0285 bump).
  #
  # Minor+patch updates are grouped into ONE PR per ecosystem so the
  # monthly run produces ~2 PRs instead of a 10-PR pile-up (cf. the
  # 2026-09-23 sweep). Major bumps always get their own PR: they need
  # real migration work and must never ride along silently.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    # typescript 7 (tsgo) is not yet supported by the frontend toolchain
    # (vite plugin, typescript-eslint) — revisit 2026-11.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]
