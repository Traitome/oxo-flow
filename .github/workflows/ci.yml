name: CI

on:
  push:
    branches: [ main, master ]
    tags:
      - "v*"
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. v0.1.0). Leave empty for a plain CI run.'
        required: false
        default: ''
      publish_images:
        description: 'With tag set: also publish Docker release images to ghcr.io (uncheck to only validate the image build against the existing release artifacts).'
        type: boolean
        required: false
        default: true
      publish_images_only:
        description: 'With tag set: skip the release pipeline (tag/version/crates) and only build the Docker release image from the existing release artifacts. Requires publish_images.'
        type: boolean
        required: false
        default: false

# Cancel in-progress runs for the same branch/PR; preserve tag releases.
# A dispatch-driven release (tag input set) runs in its own concurrency
# group so that a push to main — including the version-bump commit the
# release itself pushes — cannot cancel it between the commit push and the
# tag push (which previously left main bumped with no tag).
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' && inputs.tag != '') &&
         format('{0}-release-{1}', github.workflow, inputs.tag) ||
         format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RELEASE_TAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.tag != '') && inputs.tag || github.ref_name }}

jobs:
  # ─── Sync Cargo.toml / Cargo.lock version with git tag ─────────────────────
  sync-version:
    name: Sync version from tag
    runs-on: ubuntu-latest
    if: >-
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != '')) &&
      inputs.publish_images_only != true
    permissions:
      contents: write
    outputs:
      version: ${{ steps.extract.outputs.version }}
      # SHA of the post-bump commit (or the original trigger SHA when nothing changed).
      updated_sha: ${{ steps.push.outputs.updated_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate release tag format
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid release tag '${TAG}'. Expected v<major>.<minor>.<patch>, e.g. v0.14.0. Aborting before any commit or push."
            exit 1
          fi
          echo "Release tag format OK: ${TAG}"

      - name: Ensure release tag does not already exist
        if: github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.publish_images_only != true
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -n "$(git ls-remote --tags origin "refs/tags/${TAG}")" ]; then
            echo "::error::Tag ${TAG} already exists on origin. Never move a released tag — pick a new version for this release."
            exit 1
          fi
          echo "Tag ${TAG} does not exist yet — safe to create"

      - name: Verify embedded knowledge freshness
        if: (github.event_name == 'workflow_dispatch' && inputs.tag != '') || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          # The embedded AI knowledge data (crates/oxo-flow-ai/src/knowledge/)
          # is refreshed by the Knowledge Refresh workflow. Gate the release
          # on its freshness so a stale snapshot never ships: any auto:true
          # source older than 60 days blocks (2x the 16-day cadence, one
          # missed run tolerated). Manual sources (auto:false) are the
          # maintainer's call and are skipped.
          META="crates/oxo-flow-ai/src/knowledge/knowledge_meta.json"
          python3 - "$META" <<'PY'
          import datetime, json, sys
          path = sys.argv[1]
          MAX_AGE_DAYS = 60
          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)
          try:
              meta = json.load(open(path))
          except FileNotFoundError:
              fail(f"{path} is missing - run the Knowledge Refresh workflow (Actions -> Knowledge Refresh) before releasing")
          except json.JSONDecodeError as exc:
              fail(f"{path} is malformed JSON ({exc}) - fix it or re-run the Knowledge Refresh workflow")
          raw = meta.get("sources")
          if isinstance(raw, dict):
              items = raw.items()
          elif isinstance(raw, list):
              items = ((s.get("name", f"source#{i}"), s) for i, s in enumerate(raw))
          else:
              items = ((k, v) for k, v in meta.items() if isinstance(v, dict))
          now = datetime.datetime.now(datetime.timezone.utc)
          stale = []
          for name, src in items:
              if not isinstance(src, dict) or not src.get("auto"):
                  continue
              raw_at = src.get("generated_at")
              if not raw_at:
                  stale.append(f"{name}: no generated_at")
                  continue
              try:
                  ts = datetime.datetime.fromisoformat(str(raw_at).replace("Z", "+00:00"))
              except ValueError:
                  stale.append(f"{name}: unparseable generated_at {raw_at!r}")
                  continue
              if ts.tzinfo is None:
                  ts = ts.replace(tzinfo=datetime.timezone.utc)
              age = (now - ts).days
              if age > MAX_AGE_DAYS:
                  stale.append(f"{name}: {age} days old")
          if stale:
              fail("embedded knowledge data is stale (" + "; ".join(stale) + ") - run the Knowledge Refresh workflow first (or dispatch it manually), then re-dispatch this release")
          print("knowledge meta OK: all auto-refreshed sources are within 60 days")
          PY

      - name: Extract version from tag
        id: extract
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag version: $VERSION"

      - name: Check and patch Cargo.toml files
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.extract.outputs.version }}"
          CHANGED=false

          # All crates use version.workspace = true, so we only need to
          # update the workspace version in the root Cargo.toml.
          CURRENT=$(sed -n '/^\[workspace\.package\]/,/^\[/{ s/^version = "\(.*\)"/\1/p; }' Cargo.toml | head -1)
          if [ "$VERSION" != "$CURRENT" ]; then
            echo "Updating workspace version: $CURRENT → $VERSION"
            sed -i "/^\[workspace\.package\]/,/^\[/{ s/^version = \"$CURRENT\"/version = \"$VERSION\"/; }" Cargo.toml
            CHANGED=true
          fi

          # Also update the internal workspace crate versions in [workspace.dependencies]
          # These must carry a version so that `cargo publish` can resolve them on crates.io.
          CURRENT_DEP=${CURRENT:-$(sed -n '/^\[workspace\.dependencies\]/,/^\[/{/oxo-flow-/ s/.*version = "\([^"]*\)".*/\1/p;}' Cargo.toml | head -1)}
          if [ -n "$CURRENT_DEP" ] && [ "$VERSION" != "$CURRENT_DEP" ]; then
            echo "Updating workspace dependency versions: $CURRENT_DEP → $VERSION"
            sed -i "/^\[workspace\.dependencies\]/,/^\[/{/oxo-flow-/ s/version = \"[^\"]*\"/version = \"$VERSION\"/;}" Cargo.toml
            CHANGED=true
          fi

          # Also update the root [package] version
          ROOT_VER=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$VERSION" != "$ROOT_VER" ]; then
            ROOT_ESC=$(printf '%s' "$ROOT_VER" | sed 's/[.]/\\./g')
            sed -i "0,/^version = \"$ROOT_ESC\"/{s/^version = \"$ROOT_ESC\"/version = \"$VERSION\"/}" Cargo.toml
            CHANGED=true
          fi

          if [ -f CITATION.cff ]; then
            TODAY=$(date -u +%Y-%m-%d)
            sed -i "s/^version: .*/version: $VERSION/" CITATION.cff
            sed -i "s/^date-released: .*/date-released: \"$TODAY\"/" CITATION.cff
            CHANGED=true
          fi

          # Update docs version references (oxo-flow X.Y.Z and vX.Y.Z patterns)
          if [ -d docs/guide/src ]; then
            echo "Updating docs version references..."
            # Match patterns like: oxo-flow 0.4.2 —, "version": "0.4.2", v0.4.2
            find docs/guide/src -name "*.md" -exec sed -i -E \
              -e "s/oxo-flow [0-9]+\.[0-9]+\.[0-9]+ —/oxo-flow $VERSION —/g" \
              -e "s/\"version\": \"[0-9]+\.[0-9]+\.[0-9]+\"/\"version\": \"$VERSION\"/g" \
              -e "s/v[0-9]+\.[0-9]+\.[0-9]+/v$VERSION/g" \
              -e "s/(X-OxoFlow-Version: |\"oxo_flow_version\": \")[0-9]+\.[0-9]+\.[0-9]+/\1$VERSION/g" \
              -e "s#(ghcr\.io/traitome/oxo-flow:)[0-9]+\.[0-9]+\.[0-9]+#\1$VERSION#g" \
              -e "s#(ghcr\.io/traitome/oxo-flow:)[0-9]+\.[0-9]+\$#\1${VERSION%.*}#g" \
              -e "s/(# oxo-flow )[0-9]+\.[0-9]+\.[0-9]+/\1$VERSION/g" \
              -e "s/[\\(]\`[0-9]+\.[0-9]+\.[0-9]+\`[\\)] by value/(\`$VERSION\`) by value/g" \
              {} \;
            # Also update README.md
            if [ -f README.md ]; then
              sed -i -E \
                -e "s/oxo-flow [0-9]+\.[0-9]+\.[0-9]+ —/oxo-flow $VERSION —/g" \
                -e "s/v[0-9]+\.[0-9]+\.[0-9]+/v$VERSION/g" \
                -e "s#(ghcr\.io/traitome/oxo-flow:)[0-9]+\.[0-9]+\.[0-9]+#\1$VERSION#g" \
                -e "s#(ghcr\.io/traitome/oxo-flow:)[0-9]+\.[0-9]+\$#\1${VERSION%.*}#g" \
                README.md
            fi
            CHANGED=true
          fi

          # The desktop shell is EXCLUDED from the workspace (its manifest has
          # an empty [workspace] table), so nothing above touches it — yet it
          # repeats the release version twice: its own [package] version and
          # the caret pin on the oxo-flow-web path dependency. Left stale, the
          # ^old-version requirement cannot resolve against the bumped
          # workspace and build-macos (a required release leg) fails on the
          # first release after the pin diverges.
          DESKTOP_TOML="crates/oxo-flow-desktop/Cargo.toml"
          if [ -f "$DESKTOP_TOML" ]; then
            # Portable BRE: `^version` matches only the [package] version
            # (dependency pins are inline or indented); the oxo-flow-web
            # line address scopes the second expression to the path-dep pin.
            sed -i \
              -e "s/^version = \"[0-9][0-9.]*\"/version = \"$VERSION\"/" \
              -e "/oxo-flow-web = /s/version = \"[0-9][0-9.]*\"/version = \"$VERSION\"/" \
              "$DESKTOP_TOML"
            if ! git diff --quiet -- "$DESKTOP_TOML"; then
              echo "Updating desktop crate version pins → $VERSION"
              CHANGED=true
            fi
          fi

          # Keep the SPA's package.json version aligned (not a cargo member,
          # otherwise never bumped; its version ships inside the desktop app).
          if [ -f frontend/package.json ]; then
            sed -i "0,/\"version\": \"[0-9][0-9.]*\"/s//\"version\": \"$VERSION\"/" frontend/package.json
          fi

          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Install Rust (stable)
        if: steps.patch.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Update Cargo.lock
        if: steps.patch.outputs.changed == 'true'
        run: |
          cargo update --workspace
          # The desktop crate is excluded from the workspace and commits its
          # own lockfile; its copy of the internal crate versions must track
          # the manifest pins patched above or every later desktop build
          # fails lockfile verification.
          (cd crates/oxo-flow-desktop && cargo update --workspace)

      - name: Commit and push version bump
        id: push
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          [ -f CITATION.cff ] && git add CITATION.cff
          [ -f README.md ] && git add README.md
          [ -d docs/guide/src ] && git add docs/guide/src/*.md docs/guide/src/**/*.md
          # Excluded-desktop crate: manifest pins + its own lockfile.
          [ -f crates/oxo-flow-desktop/Cargo.toml ] && \
            git add crates/oxo-flow-desktop/Cargo.toml crates/oxo-flow-desktop/Cargo.lock
          # SPA manifest ships inside the desktop app bundle.
          [ -f frontend/package.json ] && git add frontend/package.json frontend/package-lock.json
          # Re-tagging a version whose files are already synced leaves nothing
          # to commit (CITATION.cff/docs branches set CHANGED unconditionally).
          # Tolerate it: the dedicated "Create and push release tag" step
          # still creates the tag against the current tree.
          if git diff --cached --quiet; then
            echo "Version already synced — nothing to commit"
            exit 0
          fi
          git commit -m "chore: bump version to ${{ steps.extract.outputs.version }} [skip ci]"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          NEW_SHA=$(git rev-parse HEAD)
          echo "updated_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"
          echo "New commit: $NEW_SHA"

      - name: Install git-cliff
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.12.0

      # The changelog commit is created and pushed BEFORE the tag so the tag
      # tree (git checkout <tag>) contains its own changelog entry. The tag is
      # created locally first so git-cliff labels the top section with this
      # version instead of "[Unreleased]".
      - name: Generate and commit CHANGELOG.md
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG_NAME="${{ env.RELEASE_TAG }}"
          git tag -f "$TAG_NAME" "$(git rev-parse HEAD)"
          git-cliff --config cliff.toml --output CHANGELOG.md
          if ! git diff --quiet CHANGELOG.md; then
            git add CHANGELOG.md
            git commit -m "docs: update CHANGELOG.md for ${TAG_NAME} [skip ci]"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
            echo "CHANGELOG.md committed at $(git rev-parse HEAD)"
          else
            echo "CHANGELOG.md is already up-to-date"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}

      # Unconditional within the dispatch release path (idempotent): creates
      # the tag against the current HEAD — the changelog commit when one was
      # made, otherwise the bump commit or the already-synced main tip — and
      # pushes it. The interrupted state "main bumped, no tag" is therefore
      # recoverable by re-dispatching the same version.
      - name: Create and push release tag
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${{ env.RELEASE_TAG }}"
          TARGET_SHA=$(git rev-parse HEAD)
          if git cat-file -t "$TAG_NAME" 2>/dev/null | grep -q '^tag$'; then
            TAG_MSG=$(git tag -l --format='%(contents)' "$TAG_NAME")
            git tag -d "$TAG_NAME"
            git tag -a "$TAG_NAME" "$TARGET_SHA" -m "$TAG_MSG"
          else
            git tag -f "$TAG_NAME" "$TARGET_SHA"
          fi
          # No --force: the existence guard above already verified the tag is
          # absent remotely, so a plain push fails safely if one appeared in
          # between — a released tag is never moved.
          git push origin "$TAG_NAME"
          echo "Tag $TAG_NAME created at $TARGET_SHA"

      # Tag-push releases (a tag pushed directly, no dispatch): the tag must
      # reference the synced tree the steps above commit (version bump +
      # CHANGELOG), because publish-crates checks out by tag name and fails
      # its version-match check against pre-bump versions. The tag is moved
      # to HEAD exactly once per release; a re-fire with an already-synced
      # tag exits early above ("Version already synced") and never reaches
      # this step, so the tag stays put.
      - name: Re-point tag to the synced commit (tag-push releases)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin "HEAD:refs/tags/${RELEASE_TAG}"
          echo "Tag ${RELEASE_TAG} re-pointed to $(git rev-parse HEAD)"

  # ─── Quality gate: fmt + clippy + tests ────────────────────────────────────
  test:
    name: Test (fmt, clippy, test)
    runs-on: ubuntu-latest
    needs: [sync-version]
    if: always() && (needs.sync-version.result == 'success' || needs.sync-version.result == 'skipped')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync-version.outputs.updated_sha || github.sha }}

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-build-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Lint (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: |
          export PATH="$PWD/target/debug:$PATH"

          # Issue #249 flaky governance: first attempt runs the full suite.
          # On failure, the FAILED test list is extracted from that run's
          # output and ONLY those tests re-run once — a load-timing flake
          # (signal-grace races, first-run resource contention) passes and
          # the job stays green; a genuine regression fails again and the
          # job goes red. The retry is capped at exactly one re-run so
          # persistent breakage is never masked.
          if OUT=$(cargo test --workspace 2>&1); then
            echo "$OUT"
            exit 0
          fi
          echo "$OUT"

          echo "::warning::test suite failed — re-running FAILED tests once (flake gate, issue #249)"
          FAILED=$(echo "$OUT" | grep -E "^test .* FAILED" | sed -E 's/^test ([^ ]+) \.\.\. FAILED$/\1/' | sort -u || true)
          if [ -z "$FAILED" ]; then
            echo "could not extract failed test names (compile error or format change) — failing the job"
            exit 1
          fi
          echo "Re-running: $FAILED"
          # One argument per test via a real array: an unquoted $FAILED
          # word-splits on spaces too, and a fully-quoted one arrives as a
          # single --exact filter containing newlines and matches nothing
          # (issue #297 item 8).
          mapfile -t FAILED_LIST <<< "$FAILED"
          if cargo test --workspace -- --exact "${FAILED_LIST[@]}"; then
            echo "::warning::FAILED tests passed on re-run — classified as load-timing flakes (issue #249)"
            exit 0
          fi
          exit 1
        env:
          RUST_BACKTRACE: "1"

      # Mirrors `make schema-drift`: the CLI-embedded schema must match the
      # docs copy, which is canonical.
      - name: Schema drift check
        run: make schema-drift

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Security audit
        run: cargo audit

  # ─── Build Linux binaries ──────────────────────────────────────────────────
  build-linux:
    name: Build Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [test]
    # Skip on pull_request events — the test job already validates compilation.
    # Build and package are only needed for releases and main-branch pushes.
    if: >-
      always() &&
      needs.test.result == 'success' &&
      github.event_name != 'pull_request' &&
      inputs.publish_images_only != true
    # Partial artifact sets are acceptable for feature branches only —
    # a broken release build must fail CI on main and tag pushes.
    continue-on-error: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-gnueabihf
          - armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.tag != '') && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Build release binaries (cross)
        run: |
          cross build --release --target ${{ matrix.target }} -p oxo-flow-cli
          cross build --release --target ${{ matrix.target }} -p oxo-flow-web

      - name: Package binaries
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        shell: bash
        run: |
          set -euxo pipefail
          TARGET_DIR="target/${{ matrix.target }}/release"
          mkdir -p dist
          tar -C "${TARGET_DIR}" -czvf \
            "dist/oxo-flow-${RELEASE_TAG}-${{ matrix.target }}.tar.gz" \
            "oxo-flow"
          tar -C "${TARGET_DIR}" -czvf \
            "dist/oxo-flow-web-${RELEASE_TAG}-${{ matrix.target }}.tar.gz" \
            "oxo-flow-web"

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*.tar.gz
          retention-days: 7

  # ─── Build macOS binaries ──────────────────────────────────────────────────
  build-macos:
    name: Build macOS (${{ matrix.target }})
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    needs: [test]
    # Skip on pull_request events — macOS runners are slow and expensive.
    if: >-
      always() && needs.test.result == 'success' &&
      github.event_name != 'pull_request' &&
      inputs.publish_images_only != true
    # A cancelled/unavailable runner must not block feature-branch runs,
    # but a broken macOS release build must fail CI on main and tags.
    continue-on-error: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both targets run on macos-latest (Apple Silicon).
          # Rust cross-compiles to x86_64-apple-darwin natively on arm64
          # without emulation — the macOS SDK ships both slices.
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.tag != '') && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install pinned toolchain with release target
        shell: bash
        run: |
          # rust-toolchain.toml pins the toolchain (bumped deliberately; see
          # rust-toolchain.toml for the current pin) and
          # cargo resolves every build to it — including `--target` builds.
          # dtolnay/rust-toolchain above installs "stable" only, so the
          # release target's std must be installed into the pinned
          # toolchain explicitly (cross-compiled targets like
          # x86_64-apple-darwin fail with "can't find crate for core"
          # otherwise; the host-arch target is unaffected).
          PINNED=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          echo "rust-toolchain.toml pins: $PINNED"
          rustup toolchain install "$PINNED" \
            --target ${{ matrix.target }} \
            --profile minimal \
            --no-self-update

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-${{ matrix.target }}-

      - name: Setup Node (frontend build for the desktop bundle)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend (SPA assets ship inside the app bundle)
        shell: bash
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build release binaries
        run: |
          cargo build --release --target ${{ matrix.target }} -p oxo-flow-cli
          cargo build --release --target ${{ matrix.target }} -p oxo-flow-web
          # Desktop shell lives outside the workspace (its own Cargo.toml
          # workspace), so it needs its own cargo invocation.
          (cd crates/oxo-flow-desktop && \
            cargo build --release --target ${{ matrix.target }})

      - name: Package binaries
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        shell: bash
        run: |
          set -euxo pipefail
          TARGET_DIR="target/${{ matrix.target }}/release"
          mkdir -p dist
          tar -C "${TARGET_DIR}" -czvf \
            "dist/oxo-flow-${RELEASE_TAG}-${{ matrix.target }}.tar.gz" \
            "oxo-flow"
          tar -C "${TARGET_DIR}" -czvf \
            "dist/oxo-flow-web-${RELEASE_TAG}-${{ matrix.target }}.tar.gz" \
            "oxo-flow-web"

      - name: Package desktop app (.app + .dmg)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        shell: bash
        # Single packaging path shared with `make bundle-macos` — the script
        # hand-rolls the .app bundle (bundle executable = the wry desktop
        # shell, Resources/static = the SPA, ad-hoc codesign) and emits the
        # same artifact names this job's upload step globs.
        run: |
          set -euxo pipefail
          scripts/package-macos-app.sh \
            "${{ matrix.target }}" "${RELEASE_TAG}" dist

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.dmg
            dist/*-app.zip
          retention-days: 7

  # ─── GitHub Release ────────────────────────────────────────────────────────
  release:
    permissions:
      contents: write
    name: GitHub Release
    needs: [sync-version, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) &&
      inputs.publish_images_only != true &&
      (needs.sync-version.result == 'success' || needs.sync-version.result == 'skipped') &&
      needs.build-linux.result == 'success' &&
      needs.build-macos.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.tag != '') && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.12.0

      - name: Generate changelog for this release
        shell: bash
        run: git-cliff --config cliff.toml --current --strip header --output RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage stable "latest" CLI tarballs
        shell: bash
        run: |
          set -euxo pipefail
          # Byte-identical copies of the CLI tarballs under version-less
          # names. Consumers (oxo-flow-community CI, install docs) reference
          # them via
          # https://github.com/Traitome/oxo-flow/releases/latest/download/oxo-flow-latest-x86_64-unknown-linux-gnu.tar.gz
          # (and the aarch64-apple-darwin sibling) so they track the latest
          # release without per-release edits.
          mkdir -p artifacts/dist
          # Build legs are continue-on-error ("partial artifact sets are
          # acceptable") — a missing tarball must not fail the whole release.
          for spec in "x86_64-unknown-linux-gnu" "aarch64-apple-darwin"; do
            src="artifacts/binaries-${spec}/oxo-flow-${RELEASE_TAG}-${spec}.tar.gz"
            dst="artifacts/dist/oxo-flow-latest-${spec}.tar.gz"
            if [ -f "$src" ]; then
              cp "$src" "$dst"
            else
              echo "::warning::${src} missing — skipping latest staging for ${spec}"
            fi
          done

      - name: Package Debian desktop bundle (.deb)
        shell: bash
        run: |
          set -euxo pipefail
          # The desktop Linux distribution form: the CLI binary + SPA assets
          # under /usr/share/oxo-flow (resolved by the executable-relative
          # frontend lookup). Built from the host-target binaries artifact.
          mkdir -p deb-root/DEBIAN deb-root/usr/bin deb-root/usr/share/oxo-flow
          mkdir -p deb-root/usr/share/applications deb-root/usr/share/icons/hicolor/512x512/apps \
            deb-root/usr/share/pixmaps
          tar -xzf artifacts/binaries-x86_64-unknown-linux-gnu/oxo-flow-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz \
            -C deb-root/usr/bin
          # The SPA build output was produced by build-macos (not an artifact);
          # rebuild it here so the deb is self-contained.
          cd frontend && npm ci && npm run build && cd ..
          cp -r crates/oxo-flow-web/static deb-root/usr/share/oxo-flow/static
          # Desktop entry + icon (app menu integration, same treatment the
          # macOS bundle got: launcher opens the local web interface).
          cp assets/oxo-flow.png deb-root/usr/share/icons/hicolor/512x512/apps/oxo-flow.png
          cp assets/oxo-flow.png deb-root/usr/share/pixmaps/oxo-flow.png
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=oxo-flow' \
            'Comment=Bioinformatics workflow engine with web interface' \
            'Exec=oxo-flow serve --open' \
            'Icon=oxo-flow' \
            'Terminal=false' \
            'Categories=Science;Development;' \
            > deb-root/usr/share/applications/oxo-flow.desktop
          VERSION="${RELEASE_TAG#v}"
          printf 'Package: oxo-flow\n' > deb-root/DEBIAN/control
          printf 'Version: %s\n' "${VERSION}" >> deb-root/DEBIAN/control
          printf 'Section: science\n' >> deb-root/DEBIAN/control
          printf 'Priority: optional\n' >> deb-root/DEBIAN/control
          printf 'Architecture: amd64\n' >> deb-root/DEBIAN/control
          printf 'Maintainer: Traitome <w_shixiang@163.com>\n' >> deb-root/DEBIAN/control
          printf 'Description: Bioinformatics workflow engine with web interface\n' >> deb-root/DEBIAN/control
          printf ' Rust-native pipeline engine: DAG workflows, graphical editor,\n' >> deb-root/DEBIAN/control
          printf ' AI-assisted generation, cluster execution. The desktop build\n' >> deb-root/DEBIAN/control
          printf ' starts the local web interface (oxo-flow serve --open).\n' >> deb-root/DEBIAN/control
          mkdir -p artifacts/dist
          dpkg-deb --build deb-root "artifacts/dist/oxo-flow-${RELEASE_TAG}-desktop-amd64.deb"

      - name: Package Red Hat bundle (.rpm)
        shell: bash
        run: |
          set -euxo pipefail
          # RPM for RHEL/Fedora/CentOS — same payload as the deb, built with
          # rpmbuild (installed from apt on this runner).
          sudo apt-get update -qq && sudo apt-get install -y -qq rpm
          VERSION="${RELEASE_TAG#v}"
          mkdir -p rpm-build/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          # (The spec goes through stdin — heredocs cannot terminate at
          # column 0 inside a YAML block scalar.)
          printf '%s\n' \
            'Name: oxo-flow' \
            'Version: %{version}' \
            'Release: 1' \
            'Summary: Bioinformatics workflow engine with web interface' \
            'License: Academic (free for academic use)' \
            'URL: https://github.com/Traitome/oxo-flow' \
            'BuildArch: x86_64' \
            '%description' \
            'Rust-native pipeline engine: DAG workflows, graphical editor,' \
            'AI-assisted generation, cluster execution. The desktop build' \
            'starts the local web interface (oxo-flow serve --open).' \
            '%install' \
            'mkdir -p %{buildroot}/usr/bin %{buildroot}/usr/share/oxo-flow' \
            'mkdir -p %{buildroot}/usr/share/applications %{buildroot}/usr/share/icons/hicolor/512x512/apps %{buildroot}/usr/share/pixmaps' \
            "cp $PWD/deb-root/usr/bin/oxo-flow %{buildroot}/usr/bin/oxo-flow" \
            "cp -r $PWD/deb-root/usr/share/oxo-flow/static %{buildroot}/usr/share/oxo-flow/static" \
            "cp $PWD/deb-root/usr/share/applications/oxo-flow.desktop %{buildroot}/usr/share/applications/oxo-flow.desktop" \
            "cp $PWD/assets/oxo-flow.png %{buildroot}/usr/share/icons/hicolor/512x512/apps/oxo-flow.png" \
            "cp $PWD/assets/oxo-flow.png %{buildroot}/usr/share/pixmaps/oxo-flow.png" \
            '%files' \
            '/usr/bin/oxo-flow' \
            '/usr/share/oxo-flow/static' \
            '/usr/share/applications/oxo-flow.desktop' \
            '/usr/share/icons/hicolor/512x512/apps/oxo-flow.png' \
            '/usr/share/pixmaps/oxo-flow.png' \
            > rpm-build/SPECS/oxo-flow.spec
          rpmbuild --define "_topdir $PWD/rpm-build" --define "version ${VERSION}" \
            -bb rpm-build/SPECS/oxo-flow.spec
          mkdir -p artifacts/dist
          cp rpm-build/RPMS/x86_64/oxo-flow-${VERSION}-1.x86_64.rpm \
            "artifacts/dist/oxo-flow-${RELEASE_TAG}-desktop-x86_64.rpm"

      - name: Package universal Linux bundle (.AppImage)
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="${RELEASE_TAG#v}"
          APPDIR="oxo-flow.AppDir"
          mkdir -p "${APPDIR}/usr/bin" "${APPDIR}/usr/share/oxo-flow"
          cp deb-root/usr/bin/oxo-flow "${APPDIR}/usr/bin/oxo-flow"
          cp -r deb-root/usr/share/oxo-flow/static "${APPDIR}/usr/share/oxo-flow/static"
          printf '%s\n' '#!/bin/sh' \
            '# Desktop entry: start the local web interface and open the browser.' \
            '# cd $HOME first: desktop launchers may start us in a read-only' \
            '# cwd (same defect class the macOS launcher guards against).' \
            'cd "${HOME:-/tmp}" || true' \
            'HERE="$(dirname "$(readlink -f "$0")")"' \
            'exec "${HERE}/usr/bin/oxo-flow" serve --open "$@"' \
            > "${APPDIR}/AppRun"
          chmod +x "${APPDIR}/AppRun"
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=oxo-flow' \
            'Comment=Bioinformatics workflow engine with web interface' \
            'Exec=AppRun' \
            'Icon=oxo-flow' \
            'Terminal=false' \
            'Categories=Science;Development;' \
            > "${APPDIR}/oxo-flow.desktop"
          cp assets/oxo-flow.png "${APPDIR}/oxo-flow.png"
          curl -sL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          mkdir -p artifacts/dist
          ./appimagetool "${APPDIR}" "artifacts/dist/oxo-flow-${RELEASE_TAG}-desktop-x86_64.AppImage"

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          mkdir -p artifacts/checksums
          cd artifacts
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -print0 \
            | while IFS= read -r -d '' f; do
                sha256sum "$f" | awk -v name="$(basename "$f")" '{print $1 "  " name}'
              done \
            | sort -k2 > checksums/SHA256SUMS.txt
          echo "=== SHA256SUMS ==="
          cat checksums/SHA256SUMS.txt

      - name: Generate full CHANGELOG.md
        shell: bash
        run: git-cliff --config cliff.toml --output CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/checksums/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update CHANGELOG.md in repository
        shell: bash
        run: |
          set -euo pipefail
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          cp CHANGELOG.md /tmp/CHANGELOG.md
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          cp /tmp/CHANGELOG.md CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet CHANGELOG.md; then
            git add CHANGELOG.md
            git commit -m "docs: update CHANGELOG.md for ${RELEASE_TAG} [skip ci]"
            git push origin "$DEFAULT_BRANCH"
          else
            echo "CHANGELOG.md is already up-to-date"
          fi

  # ─── Publish crates to crates.io (dependency order) ────────────────────────
  publish-crates:
    name: Publish to crates.io
    # Depend directly on sync-version + test so crates.io publishing is not
    # blocked by binary build failures or a skipped GitHub Release job.
    # Publishing source crates is independent of the binary release artifacts.
    # publish_images_only validation runs skip this entirely — a dry-run must
    # never touch the crates.io registry.
    needs: [sync-version, test]
    runs-on: ubuntu-latest
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != '')) &&
      inputs.publish_images_only != true &&
      (needs.sync-version.result == 'success' || needs.sync-version.result == 'skipped') &&
      needs.test.result == 'success'
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tag events: sync-version force-pushed the tag to the version-bump
          # commit — checking out by tag name resolves to it. Dispatch:
          # there is no tag ref for github.ref (it is the default branch),
          # so use sync-version's recorded bump SHA instead.
          ref: ${{ (github.event_name == 'workflow_dispatch' && needs.sync-version.outputs.updated_sha) || github.ref }}

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Confirm version matches tag
        shell: bash
        run: |
          set -euxo pipefail
          TAG="${RELEASE_TAG#v}"
          echo "Tag version: $TAG"
          for crate in oxo-flow-core oxo-flow-ai oxo-flow-web oxo-flow-cli; do
            VER=$(cargo metadata --no-deps --format-version=1 \
              | python3 -c "import sys,json; pkgs=json.load(sys.stdin)['packages']; print(next(p['version'] for p in pkgs if p['name']=='$crate'))")
            echo "$crate version: $VER"
            if [ "$TAG" != "$VER" ]; then
              echo "::error::Version mismatch: tag=$TAG $crate=$VER"
              exit 1
            fi
          done

      - name: Publish oxo-flow-core
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          # Query crates.io API to detect already-published versions (idempotent re-runs).
          # Status 000 means a network failure; we assume not published and attempt anyway.
          STATUS=$(curl -sf "https://crates.io/api/v1/crates/oxo-flow-core/${VERSION}" \
            -H "User-Agent: oxo-flow-ci/1.0 (github.com/Traitome/oxo-flow)" \
            -o /dev/null -w "%{http_code}" 2>/dev/null || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "oxo-flow-core ${VERSION} already on crates.io, skipping"
          else
            [ "$STATUS" = "000" ] && echo "::warning::crates.io reachability check failed, attempting publish anyway"
            cargo publish -p oxo-flow-core
          fi

      # crates.io sparse-index propagation typically completes within 30-60 s.
      # We use 60 s to give a comfortable margin before dependent crates publish.
      - name: Wait for crates.io index (oxo-flow-core)
        run: sleep 60

      - name: Publish oxo-flow-ai
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STATUS=$(curl -sf "https://crates.io/api/v1/crates/oxo-flow-ai/${VERSION}" \
            -H "User-Agent: oxo-flow-ci/1.0 (github.com/Traitome/oxo-flow)" \
            -o /dev/null -w "%{http_code}" 2>/dev/null || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "oxo-flow-ai ${VERSION} already on crates.io, skipping"
          else
            [ "$STATUS" = "000" ] && echo "::warning::crates.io reachability check failed, attempting publish anyway"
            cargo publish -p oxo-flow-ai
          fi

      - name: Wait for crates.io index (oxo-flow-ai)
        run: sleep 60

      - name: Publish oxo-flow-web
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STATUS=$(curl -sf "https://crates.io/api/v1/crates/oxo-flow-web/${VERSION}" \
            -H "User-Agent: oxo-flow-ci/1.0 (github.com/Traitome/oxo-flow)" \
            -o /dev/null -w "%{http_code}" 2>/dev/null || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "oxo-flow-web ${VERSION} already on crates.io, skipping"
          else
            [ "$STATUS" = "000" ] && echo "::warning::crates.io reachability check failed, attempting publish anyway"
            cargo publish -p oxo-flow-web
          fi

      - name: Wait for crates.io index (oxo-flow-web)
        run: sleep 60

      - name: Publish oxo-flow-cli
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STATUS=$(curl -sf "https://crates.io/api/v1/crates/oxo-flow-cli/${VERSION}" \
            -H "User-Agent: oxo-flow-ci/1.0 (github.com/Traitome/oxo-flow)" \
            -o /dev/null -w "%{http_code}" 2>/dev/null || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "oxo-flow-cli ${VERSION} already on crates.io, skipping"
          else
            [ "$STATUS" = "000" ] && echo "::warning::crates.io reachability check failed, attempting publish anyway"
            cargo publish -p oxo-flow-cli
          fi

  # ─── Docker: the shipped Dockerfile must actually build ───────────────────
  # Issue #276: rust:1.92-slim < MSRV 1.98 broke `docker build .` for every
  # user and nothing in CI noticed. This gate keeps the container image
  # buildable on every push to main / PR.
  docker-build:
    name: Docker (build)
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && needs.test.result == 'success'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync-version.outputs.updated_sha || github.sha }}

      - name: Build the image
        run: docker build -t oxo-flow:ci .

      - name: Smoke-test the container (health endpoint)
        run: |
          docker run -d --name oxo-flow-ci -p 3000:3000 oxo-flow:ci
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/api/health | grep -q '"status":"ok"'; then
              echo "container healthy"
              docker rm -f oxo-flow-ci > /dev/null
              exit 0
            fi
            sleep 3
          done
          echo "::error::container did not become healthy"
          docker logs oxo-flow-ci || true
          docker rm -f oxo-flow-ci > /dev/null || true
          exit 1

  # Validation leg for the release channel: builds Dockerfile.release from an
  # EXISTING release's artifacts (no tag push, no publish) so the channel's
  # download → verify → assemble → serve path is exercised between releases.
  # Skipped everywhere except manual dispatch with a tag input.
  docker-build-release:
    name: Docker (build release, no publish)
    runs-on: ubuntu-latest
    needs: [test]
    if: >-
      always() &&
      needs.test.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.tag != ''
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation for the non-native leg)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the release image (both platforms, no push)
        run: |
          # Version comes straight from the tag input (sync-version is skipped
          # in publish_images_only mode and cannot run for an existing tag).
          # No --load: a multi-platform build produces a manifest list, which
          # the docker exporter cannot load; validation happens in the build
          # itself (both platforms must assemble successfully).
          VERSION="${TAG#v}"
          docker buildx build \
            --file Dockerfile.release \
            --build-arg VERSION="$VERSION" \
            --platform linux/amd64,linux/arm64 \
            -t oxo-flow-release:ci \
            .
        env:
          TAG: ${{ inputs.tag }}

  # ─── Docker: publish the image to ghcr.io (GitHub Packages) ───────────────
  # Two channels with distinct jobs:
  #   docker-publish-main-{amd64,arm64} + docker-publish
  #                         — main pushes → per-arch source builds
  #                            (Dockerfile) pushed as :main-<arch>, then a
  #                            manifest job merges them into :main so
  #                            arm64 hosts pulling :main get a native image
  #                            instead of a broken amd64-only one (issue
  #                            #297 item 9). This is the regression gate:
  #                            the shipped Dockerfile must keep compiling
  #                            on both arches.
  #   docker-publish-release — release tags/dispatch → :<version> (+ :latest
  #                            and :<major.minor> after the smoke gate),
  #                            multi-arch (amd64+arm64) from the prebuilt
  #                            release binaries (Dockerfile.release,
  #                            SHA256-verified), so the image is
  #                            byte-identical with the release tarballs.
  docker-publish-main-amd64:
    name: Docker (build :main amd64 → ghcr.io)
    runs-on: ubuntu-latest
    needs: [sync-version, test, docker-build]
    if: >-
      always() &&
      needs.docker-build.result == 'success' &&
      (needs.sync-version.result == 'success' || needs.sync-version.result == 'skipped') &&
      needs.test.result == 'success' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync-version.outputs.updated_sha || github.sha }}

      # repository_owner is "Traitome" (uppercase) but ghcr requires lowercase
      # image paths — force it down (${VAR,,} bash lowercase).
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oxo-flow" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:main-amd64
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=main-amd64
          cache-to: type=gha,mode=max,scope=main-amd64

  docker-publish-main-arm64:
    name: Docker (build :main arm64 → ghcr.io)
    # Native arm64 runner (free for public repos) — building the Rust image
    # under QEMU emulation would take hours, which is why :main used to ship
    # amd64-only (issue #297 item 9).
    runs-on: ubuntu-24.04-arm
    needs: [sync-version, test, docker-build]
    if: >-
      always() &&
      needs.docker-build.result == 'success' &&
      (needs.sync-version.result == 'success' || needs.sync-version.result == 'skipped') &&
      needs.test.result == 'success' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync-version.outputs.updated_sha || github.sha }}

      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oxo-flow" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:main-arm64
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=main-arm64
          cache-to: type=gha,mode=max,scope=main-arm64

  docker-publish:
    name: Docker (publish :main manifest to ghcr.io)
    runs-on: ubuntu-latest
    needs: [sync-version, test, docker-publish-main-amd64, docker-publish-main-arm64]
    if: >-
      always() &&
      needs.docker-publish-main-amd64.result == 'success' &&
      needs.docker-publish-main-arm64.result == 'success' &&
      (needs.sync-version.result == 'success' || needs.sync-version.result == 'skipped') &&
      needs.test.result == 'success' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      # repository_owner is "Traitome" (uppercase) but ghcr requires lowercase
      # image paths — force it down (${VAR,,} bash lowercase).
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oxo-flow" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge per-arch images into the moving :main manifest
        run: |
          # imagetools create is registry-side: it assembles a manifest list
          # referencing the two just-pushed per-arch images and pushes it as
          # :main. Main pushes get this moving tag instead of a misleading
          # :latest (release tags are published by docker-publish-release).
          docker buildx imagetools create \
            -t "${IMAGE}:main" \
            "${IMAGE}:main-amd64" "${IMAGE}:main-arm64"
          docker buildx imagetools inspect "${IMAGE}:main"

      - name: Smoke-test the pushed image (health endpoint)
        run: |
          docker pull "${IMAGE}:main"
          docker run -d --name oxo-flow-pub -p 3000:3000 "${IMAGE}:main"
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/api/health | grep -q '"status":"ok"'; then
              echo "published image healthy"
              docker rm -f oxo-flow-pub > /dev/null
              exit 0
            fi
            sleep 3
          done
          echo "::error::published image did not become healthy"
          docker logs oxo-flow-pub || true
          docker rm -f oxo-flow-pub > /dev/null || true
          exit 1

  # Release channel: assembles the image from the prebuilt release binaries
  # (no cargo build) as a multi-arch manifest (amd64 + arm64), publishing
  # ghcr.io/traitome/oxo-flow:<version>, then — only after the version-tag
  # image passed the smoke test — promoting :latest and :<major.minor> from
  # it server-side. Runs on release tags / dispatch-with-tag, and after the
  # release job has uploaded the artifacts — the binaries it installs come
  # from that release, verified against SHA256SUMS.txt inside
  # Dockerfile.release. A dispatch with publish_images_only=true skips the
  # release pipeline entirely (release job → 'skipped') and publishes from
  # the EXISTING release's artifacts — that mode is what makes the
  # publish_images_only input functional instead of a no-op (issue #297
  # item 3).
  docker-publish-release:
    name: Docker (publish release to ghcr.io)
    runs-on: ubuntu-latest
    needs: [sync-version, test, release]
    if: >-
      always() &&
      (needs.release.result == 'success' ||
       (needs.release.result == 'skipped' && inputs.publish_images_only == true)) &&
      (needs.sync-version.result == 'success' || needs.sync-version.result == 'skipped') &&
      needs.test.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.publish_images == true))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && needs.sync-version.outputs.updated_sha) || github.ref }}

      # repository_owner is "Traitome" (uppercase) but ghcr requires lowercase
      # image paths — force it down (${VAR,,} bash lowercase).
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oxo-flow" >> "$GITHUB_ENV"

      - name: Set up QEMU (arm64 emulation for the non-native leg)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version (sync-version is skipped in publish_images_only mode)
        run: |
          set -euo pipefail
          # Normal releases get the version from sync-version; a
          # publish_images_only dispatch re-publishes an EXISTING release,
          # so the version comes from the tag input instead (same fallback
          # as the docker-build-release validation leg).
          if [ -n "$SYNC_VERSION" ]; then
            VERSION="$SYNC_VERSION"
          else
            VERSION="${TAG#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing version: $VERSION"
        env:
          SYNC_VERSION: ${{ needs.sync-version.outputs.version }}
          TAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.tag != '') && inputs.tag || github.ref_name }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.release
          # VERSION is the synced release version; the Dockerfile resolves
          # the per-arch tarball triple from TARGETARCH at build time.
          build-args: VERSION=${{ env.VERSION }}
          platforms: linux/amd64,linux/arm64
          push: true
          # Only the immutable version tag is pushed here. :latest (and the
          # rolling :<major.minor>) are promoted from it AFTER the smoke
          # test below — tagging :latest in this step would publish a broken
          # release as "latest" with no gate (issue #297 item 2).
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: false

      - name: Smoke-test the pushed image (health endpoint, native arch)
        run: |
          docker pull "${IMAGE}:${VERSION}"
          docker run -d --name oxo-flow-pub -p 3000:3000 "${IMAGE}:${VERSION}"
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/api/health | grep -q '"status":"ok"'; then
              echo "published release image healthy"
              docker rm -f oxo-flow-pub > /dev/null
              exit 0
            fi
            sleep 3
          done
          echo "::error::published release image did not become healthy"
          docker logs oxo-flow-pub || true
          docker rm -f oxo-flow-pub > /dev/null || true
          exit 1

      - name: Promote :latest and :<major.minor> (smoke-gated, both arches)
        run: |
          set -euo pipefail
          # Server-side re-tag of the pushed multi-arch manifest list — no
          # rebuild, so BOTH platforms carry over (a docker tag+push here
          # would replace the manifest with a single-arch image).
          MAJOR_MINOR="${VERSION%.*}"
          # Re-publishing an OLD release (publish_images_only dispatch) must
          # not drag :latest backwards — only the repo's actual latest
          # release gets the :latest alias; older ones keep their immutable
          # version tag and gain only the rolling :<major.minor>.
          LATEST_TAG=$(curl -sf "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" \
            | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4 || true)
          if [ -n "$LATEST_TAG" ] && [ "$LATEST_TAG" != "$RELEASE_TAG" ]; then
            echo "::warning::${RELEASE_TAG} is not the latest release (${LATEST_TAG}) — promoting only :${MAJOR_MINOR}, :latest stays with ${LATEST_TAG}"
            docker buildx imagetools create -t "${IMAGE}:${MAJOR_MINOR}" "${IMAGE}:${VERSION}"
            exit 0
          fi
          docker buildx imagetools create -t "${IMAGE}:latest" "${IMAGE}:${VERSION}"
          docker buildx imagetools create -t "${IMAGE}:${MAJOR_MINOR}" "${IMAGE}:${VERSION}"
          echo "promoted ${IMAGE}:${VERSION} → :latest and :${MAJOR_MINOR}"

  # ─── Frontend: build + e2e (Playwright against the real server) ──────────
  frontend:
    name: Frontend (build + e2e)
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && needs.test.result == 'success'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-build-

      - name: Build the web server (Playwright spawns it)
        run: |
          # Build ONLY what Playwright's webServer runs (`cargo run -p
          # oxo-flow-web`). Adding -p oxo-flow-cli unifies features over
          # both packages, so the e2e spawn recompiles feature-sensitive
          # deps (libsqlite3-sys/reqwest/rustls) with the web-only feature
          # set — a ~53s cold build that blew the old 60s webServer
          # timeout (live: actions run 32327397451).
          cargo build -p oxo-flow-web

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Dependency-vulnerability gate (issue #209): the local npm mirror
      # does not implement the audit endpoint, so this must query the
      # canonical registry explicitly. Prod deps gate hard; dev deps are
      # reported until a baseline is established.
      - name: Audit npm dependencies
        working-directory: frontend
        run: |
          npm audit --omit=dev --registry=https://registry.npmjs.org
          npm audit --registry=https://registry.npmjs.org || \
            echo "::warning::dev-dependency advisories present — triage before merging"

      - name: Lint the SPA
        working-directory: frontend
        run: npm run lint

      - name: Build the SPA
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: frontend
        run: npx playwright test

  # ─── Deploy GitHub Pages (landing page + MkDocs documentation) ─────────────
  deploy-pages:
    name: Deploy versioned documentation (mike)
    runs-on: ubuntu-latest
    needs: [test]
    if: >-
      always() &&
      needs.test.result == 'success' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs Material + mike
        run: pip install mkdocs-material mike

      - name: Configure git identity (mike pushes the gh-pages branch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy with mike
        run: |
          cd docs/guide
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "Deploying release version ${VERSION} (+ latest alias)"
            mike deploy --push --update-aliases "${VERSION}" latest
          else
            echo "Deploying dev version"
            mike deploy --push dev
          fi

      - name: Preserve landing page + static assets at the Pages root
        run: |
          # mike's tree replaces the branch root; the hand-authored landing
          # page and the static docs/ assets must be re-laid after every
          # deploy (issue #176: keep /oxo-flow/ the landing, versions live
          # under /latest/, /dev/, /<tag>/).
          mkdir -p /tmp/pages-extra
          cp -r docs/index.html docs/CHANGE_CONTROL.md docs/VALIDATION_PROTOCOL.md \
            docs/schema docs/superpowers /tmp/pages-extra/
          git fetch origin gh-pages
          git checkout gh-pages
          cp /tmp/pages-extra/index.html index.html
          cp /tmp/pages-extra/CHANGE_CONTROL.md CHANGE_CONTROL.md
          cp /tmp/pages-extra/VALIDATION_PROTOCOL.md VALIDATION_PROTOCOL.md
          cp -r /tmp/pages-extra/schema schema
          cp -r /tmp/pages-extra/superpowers superpowers
          git add -A
          # The tree is often unchanged (idempotent re-runs, deploy-only
          # changes) — an empty commit fails the job for no reason.
          if git diff --cached --quiet; then
            echo "landing page + static assets already in place — nothing to commit"
          else
            git commit -m "chore: preserve landing page + static assets (${GITHUB_SHA:0:7})" \
              && git push origin gh-pages
          fi
