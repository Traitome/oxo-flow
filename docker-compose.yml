version: "3.9"

services:
  oxo-flow:
    build: .
    ports:
      - "3000:3000"
    volumes:
      # Persist database, logs, and workspace across container restarts
      - oxo-flow-data:/app
    environment:
      - OXO_FLOW_MODE=team
      - OXO_FLOW_HOST=0.0.0.0
      - OXO_FLOW_PORT=3000
      - OXO_FLOW_FRONTEND_DIR=/app/frontend/dist
      # Authentication — CHANGE THESE in production:
      - OXO_FLOW_ADMIN_PASSWORD=changeme
      # AI Provider Configuration (optional)
      # - OXO_FLOW_AI_PROVIDER=openai
      # - OXO_FLOW_AI_API_KEY=sk-your-key
      # - OXO_FLOW_AI_API_URL=https://api.deepseek.com/v1/chat/completions
      # - OXO_FLOW_AI_MODEL=deepseek-chat
      # PostgreSQL (optional — uncomment to use instead of SQLite)
      # - DATABASE_URL=postgres://user:pass@postgres:5432/oxoflow
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  oxo-flow-data:
