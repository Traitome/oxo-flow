services:
  oxo-flow:
    build: .
    ports:
      - "3000:3000"
    volumes:
      # Persist only the state directory: /app/data holds the SQLite DB
      # (oxo-flow.db, relative to the image's WORKDIR /app/data), logs/ and
      # workspace/. Mounting the volume over /app would shadow the image's
      # binaries (/app/oxo-flow-web, /app/oxo-flow, /app/frontend/dist) once
      # the volume is non-empty, so a pull/rebuild would keep serving the old
      # binaries.
      - oxo-flow-data:/app/data
    environment:
      - OXO_FLOW_MODE=team
      - OXO_FLOW_HOST=0.0.0.0
      - OXO_FLOW_PORT=3000
      - OXO_FLOW_FRONTEND_DIR=/app/frontend/dist
      # Authentication — CHANGE THESE in production:
      - OXO_FLOW_ADMIN_PASSWORD=changeme
      # AI provider passthrough — the README/AGENTS one-liners
      # (`OXO_FLOW_AI_PROVIDER=... docker compose up -d`) rely on these
      # value-less entries to forward host env into the container.
      - OXO_FLOW_AI_PROVIDER
      - OXO_FLOW_AI_API_KEY
      - OXO_FLOW_AI_API_URL
      - OXO_FLOW_AI_MODEL
      - OXO_FLOW_AI_MAX_TOKENS
      - OXO_FLOW_AI_TIMEOUT_SECS
      - OXO_FLOW_MASTER_KEY
      - ANTHROPIC_AUTH_TOKEN
      - ANTHROPIC_BASE_URL
      - ANTHROPIC_MODEL
      - OPENAI_API_KEY
      - OPENAI_BASE_URL
      - OPENAI_MODEL
      - DEEPSEEK_API_KEY
      # Other deployment knobs the server reads (all optional):
      - OXO_FLOW_TRUSTED_PROXY
      - OXO_FLOW_RUNS_RATE_LIMIT
      - OXO_FLOW_ALLOWED_ORIGINS
      - OXO_FLOW_OAUTH_REDIRECT_URI
      - ORCID_CLIENT_ID
      - ORCID_CLIENT_SECRET
      - GITHUB_CLIENT_ID
      - GITHUB_CLIENT_SECRET
      - OXO_FLOW_LICENSE
      # PostgreSQL (optional): the published image builds WITHOUT the
      # `postgres` compile feature, so uncommenting this line crash-loops
      # the container at startup (it refuses a postgres:// URL and
      # restart: unless-stopped retries forever). Library/AI/auth work on
      # PostgreSQL, but run execution stays SQLite-only (issue #207) —
      # switching here also requires a SQLite run DB. Custom builds opt in
      # with: cargo build --release -p oxo-flow-web --features postgres
      # - DATABASE_URL=postgres://user:pass@postgres:5432/oxoflow
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  oxo-flow-data:
